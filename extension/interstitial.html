<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>grantgate: check this sign-in</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.45; }
    body { margin: 0; padding: 2rem 1rem; }
    main { max-width: 40rem; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    .lead { font-size: 1.05rem; }
    .facts { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; }
    .facts dt { font-weight: 600; }
    .facts dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, monospace; }
    .scopes { padding-left: 1.25rem; }
    .scopes li { margin: 0.35rem 0; overflow-wrap: anywhere; }
    .badge { display: inline-block; min-width: 6.5rem; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .rating-high .badge { color: #c5221f; }
    .rating-medium .badge { color: #b06000; }
    .rating-low .badge { color: #137333; }
    .note { font-size: 0.9rem; opacity: 0.8; }
    .choices { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.5rem; }
    button { font: inherit; padding: 0.6rem 1rem; border-radius: 0.4rem; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
    button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    button:disabled { opacity: 0.5; cursor: progress; }
  </style>
  <script type="module" src="js/extension/interstitial.js"></script>
</head>
<body>
  <main id="app" aria-live="polite"><p>Checking this sign-in…</p></main>
</body>
</html>
